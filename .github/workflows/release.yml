name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout vole-macos
        uses: actions/checkout@v4

      - name: Checkout vole (sidecar source)
        uses: actions/checkout@v4
        with:
          repository: wukongnotnull/vole
          path: vole

      - name: Require signing + notary secrets
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          VOLE_CODESIGN_IDENTITY: ${{ secrets.VOLE_CODESIGN_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          missing=0
          for name in \
            APPLE_CERTIFICATE_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            VOLE_CODESIGN_IDENTITY \
            APPLE_API_KEY_BASE64 \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER_ID
          do
            if [[ -z "${!name:-}" ]]; then
              echo "FAIL: missing GitHub secret: $name" >&2
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "Configure secrets via: bash scripts/setup-ci-secrets.sh" >&2
            echo "See README § Release / design 2026-08-10-2315-macos-dmg-ci-release" >&2
            exit 1
          fi
          echo "OK: all required release secrets present"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vole/target
          key: ${{ runner.os }}-vole-sidecar-${{ hashFiles('vole/Cargo.lock') }}

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/vole-macos-signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Archive and export
        env:
          VOLE_SRC: ${{ github.workspace }}/vole
          VOLE_CODESIGN_IDENTITY: ${{ secrets.VOLE_CODESIGN_IDENTITY }}
        run: bash scripts/archive-and-export.sh

      - name: Notarize and staple
        env:
          VOLE_CODESIGN_IDENTITY: ${{ secrets.VOLE_CODESIGN_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: bash scripts/notarize-app.sh

      - name: Package DMG + zip + checksums
        run: |
          # Strip leading v from tag (v0.1.0 → 0.1.0)
          VERSION="${GITHUB_REF_NAME#v}"
          export VOLE_DMG_VERSION="$VERSION"
          bash scripts/package-dmg.sh

          APP="dist/Vole.app"
          ZIP="dist/Vole-${VERSION}.zip"
          rm -f "$ZIP"
          ditto -c -k --keepParent "$APP" "$ZIP"

          (
            cd dist
            shasum -a 256 \
              "Vole-${VERSION}.dmg" \
              "Vole-${VERSION}.zip" > SHA256SUMS
          )
          echo "Artifacts:"
          ls -lh "dist/Vole-${VERSION}.dmg" "dist/Vole-${VERSION}.zip" dist/SHA256SUMS

      - name: Upload GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Vole-*.dmg
            dist/Vole-*.zip
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
